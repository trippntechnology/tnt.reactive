# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net
# For trusted publishing: https://learn.microsoft.com/en-us/nuget/nuget-org/trusted-publishing

name: Publish

on:
  push:
    branches: [ "release" ]

jobs:
  build:

    runs-on: windows-latest
    permissions:
      id-token: write  # Required for OIDC token issuance

    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Publish
      run: dotnet nuget push "tnt.reactive\bin\Release\*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
